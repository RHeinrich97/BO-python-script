<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540">
  <title>Autopilot v3.8 — orchestration adaptative par phase</title>
  <desc>Schema de l'autopilot v3.8 de bo_chemistry.py : calcul progress et coverage, decision de phase EARLY/MID/LATE, choix d'acquisition contextualise, override par phase optionnel, boucle BO.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 13px; font-weight: 500; }
      .ts { font-size: 11px; fill: #555; }
      .tn { font-size: 10px; fill: #777; font-style: italic; }
      .arr { stroke: #555; stroke-width: 1.5; fill: none; }
      .arr-dash { stroke: #888; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray text { fill: #2C2C2A; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue text { fill: #0C447C; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal text { fill: #085041; }
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber text { fill: #633806; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral text { fill: #4A1B0C; }
      .c-violet rect { fill: #EFE6F4; stroke: #5E2D85; }
      .c-violet text { fill: #341A4D; }
    </style>
  </defs>

  <!-- ETAGE 1 : ETAT DE LA CAMPAGNE -->
  <g class="c-gray">
    <rect x="290" y="20" width="200" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="44" text-anchor="middle">Donnees campagne (df)</text>
    <text class="ts" x="390" y="62" text-anchor="middle">best_y, n_init, n_iter</text>
    <text class="tn" x="390" y="76" text-anchor="middle">+ historique conditions testees</text>
  </g>

  <!-- ETAGE 2 : CALCUL ETAT -->
  <g class="c-blue">
    <rect x="80" y="120" width="200" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="180" y="144" text-anchor="middle">progress = best / target</text>
    <text class="ts" x="180" y="162" text-anchor="middle">target = 95 (ou auto)</text>
    <text class="tn" x="180" y="176" text-anchor="middle">avancement vers but</text>
  </g>
  <g class="c-blue">
    <rect x="500" y="120" width="200" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="600" y="144" text-anchor="middle">coverage</text>
    <text class="ts" x="600" y="162" text-anchor="middle">% espace explore</text>
    <text class="tn" x="600" y="176" text-anchor="middle">nb categories testees / total</text>
  </g>

  <!-- ETAGE 3 : DECISION DE PHASE -->
  <g class="c-teal">
    <rect x="40" y="230" width="200" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="254" text-anchor="middle">EARLY</text>
    <text class="ts" x="140" y="272" text-anchor="middle">progress &lt; 0.7</text>
    <text class="tn" x="140" y="286" text-anchor="middle">exploration moderee</text>
  </g>
  <g class="c-amber">
    <rect x="290" y="230" width="200" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="254" text-anchor="middle">MID</text>
    <text class="ts" x="390" y="272" text-anchor="middle">0.7 &#8804; progress &lt; 0.95</text>
    <text class="tn" x="390" y="286" text-anchor="middle">equilibre</text>
  </g>
  <g class="c-coral">
    <rect x="540" y="230" width="200" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="640" y="254" text-anchor="middle">LATE</text>
    <text class="ts" x="640" y="272" text-anchor="middle">progress &#8805; 0.95</text>
    <text class="tn" x="640" y="286" text-anchor="middle">affinage strict</text>
  </g>

  <!-- ETAGE 4 : ACQUISITION CHOISIE -->
  <g class="c-teal">
    <rect x="40" y="340" width="200" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="362" text-anchor="middle">EI  xi=0.05</text>
    <text class="ts" x="140" y="380" text-anchor="middle">si coverage &lt; 30%:</text>
    <text class="ts" x="140" y="396" text-anchor="middle">UCB kappa=2.0</text>
    <text class="tn" x="140" y="410" text-anchor="middle">explorer plus large</text>
  </g>
  <g class="c-amber">
    <rect x="290" y="340" width="200" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="362" text-anchor="middle">EI  xi=0.02</text>
    <text class="ts" x="390" y="380" text-anchor="middle">si coverage &lt; 40%:</text>
    <text class="ts" x="390" y="396" text-anchor="middle">EI-TS hybride</text>
    <text class="tn" x="390" y="410" text-anchor="middle">diversifier via TS</text>
  </g>
  <g class="c-coral">
    <rect x="540" y="340" width="200" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="640" y="362" text-anchor="middle">EI  xi=0.005</text>
    <text class="ts" x="640" y="380" text-anchor="middle">si coverage &lt; 50%:</text>
    <text class="ts" x="640" y="396" text-anchor="middle">EI-TS hybride</text>
    <text class="tn" x="640" y="410" text-anchor="middle">combler zones d'ombre</text>
  </g>

  <!-- OVERRIDE OPTIONNEL -->
  <g class="c-violet">
    <rect x="280" y="450" width="220" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="472" text-anchor="middle">Override YAML (v3.8)</text>
    <text class="ts" x="390" y="488" text-anchor="middle">autopilot_acquisition_&lt;phase&gt;</text>
    <text class="tn" x="390" y="502" text-anchor="middle">force ex. TEI uniquement en LATE</text>
  </g>

  <!-- FLECHES PRINCIPALES -->
  <!-- Etage 1 -> Etage 2 -->
  <path d="M340 84 L340 100 L180 100 L180 116" class="arr" marker-end="url(#arrow)"/>
  <path d="M440 84 L440 100 L600 100 L600 116" class="arr" marker-end="url(#arrow)"/>

  <!-- Etage 2 -> Etage 3 (les deux nourrissent les 3 phases) -->
  <path d="M180 184 L180 200 L140 200 L140 226" class="arr" marker-end="url(#arrow)"/>
  <path d="M180 184 L180 200 L390 200 L390 226" class="arr" marker-end="url(#arrow)"/>
  <path d="M600 184 L600 200 L640 200 L640 226" class="arr" marker-end="url(#arrow)"/>
  <path d="M600 184 L600 200 L390 200 L390 226" class="arr" opacity="0.0"/>

  <!-- Etage 3 -> Etage 4 -->
  <line x1="140" y1="294" x2="140" y2="336" class="arr" marker-end="url(#arrow)"/>
  <line x1="390" y1="294" x2="390" y2="336" class="arr" marker-end="url(#arrow)"/>
  <line x1="640" y1="294" x2="640" y2="336" class="arr" marker-end="url(#arrow)"/>

  <!-- Override pointe vers les 3 acquisitions -->
  <path d="M310 450 L140 450 L140 420" class="arr-dash" marker-end="url(#arrow)"/>
  <line x1="390" y1="448" x2="390" y2="420" class="arr-dash" marker-end="url(#arrow)"/>
  <path d="M470 450 L640 450 L640 420" class="arr-dash" marker-end="url(#arrow)"/>

</svg>
