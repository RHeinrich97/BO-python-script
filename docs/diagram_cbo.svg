<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480">
  <title>cBO constrained Bayesian optimization</title>
  <desc>Schema cBO : un GP par objectif et un GP par contrainte. L'acquisition EI est multipliee par P(contrainte respectee) pour chaque contrainte. Le candidat retenu maximise EI penalise.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; fill: #555; }
      .arr { stroke: #555; stroke-width: 1.5; fill: none; }
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray text { fill: #2C2C2A; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue text { fill: #0C447C; }
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber text { fill: #633806; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral text { fill: #4A1B0C; }
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple text { fill: #3C3489; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal text { fill: #085041; }
    </style>
  </defs>

  <g class="c-gray">
    <rect x="240" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="55" text-anchor="middle">Donnees experimentales</text>
    <text class="ts" x="340" y="73" text-anchor="middle">y_obj, c_1, c_2, ...</text>
  </g>
  <g class="c-blue">
    <rect x="50" y="140" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="165" text-anchor="middle">GP objectif</text>
    <text class="ts" x="130" y="183" text-anchor="middle">y = rendement</text>
  </g>
  <g class="c-amber">
    <rect x="260" y="140" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="165" text-anchor="middle">GP contrainte 1</text>
    <text class="ts" x="340" y="183" text-anchor="middle">tar_formed ≤ 5</text>
  </g>
  <g class="c-coral">
    <rect x="470" y="140" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="165" text-anchor="middle">GP contrainte 2</text>
    <text class="ts" x="550" y="183" text-anchor="middle">ee ≥ 80</text>
  </g>
  <g class="c-blue">
    <rect x="50" y="240" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="265" text-anchor="middle">EI(x)</text>
    <text class="ts" x="130" y="283" text-anchor="middle">acquisition de base</text>
  </g>
  <g class="c-amber">
    <rect x="260" y="240" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="265" text-anchor="middle">P(c_1 ≤ 5 | x)</text>
    <text class="ts" x="340" y="283" text-anchor="middle">CDF gaussien</text>
  </g>
  <g class="c-coral">
    <rect x="470" y="240" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="265" text-anchor="middle">P(c_2 ≥ 80 | x)</text>
    <text class="ts" x="550" y="283" text-anchor="middle">CDF gaussien</text>
  </g>
  <g class="c-purple">
    <rect x="200" y="340" width="280" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="367" text-anchor="middle">EI_c(x) = EI(x) × P(c_1) × P(c_2)</text>
    <text class="ts" x="340" y="387" text-anchor="middle">Acquisition penalisee par les contraintes</text>
  </g>
  <g class="c-teal">
    <rect x="240" y="430" width="200" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="455" text-anchor="middle">Suggest argmax EI_c(x)</text>
  </g>

  <line x1="280" y1="86" x2="150" y2="135" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="86" x2="340" y2="135" class="arr" marker-end="url(#arrow)"/>
  <line x1="400" y1="86" x2="530" y2="135" class="arr" marker-end="url(#arrow)"/>
  <line x1="130" y1="196" x2="130" y2="235" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="196" x2="340" y2="235" class="arr" marker-end="url(#arrow)"/>
  <line x1="550" y1="196" x2="550" y2="235" class="arr" marker-end="url(#arrow)"/>
  <line x1="170" y1="296" x2="280" y2="335" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="296" x2="340" y2="335" class="arr" marker-end="url(#arrow)"/>
  <line x1="510" y1="296" x2="400" y2="335" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="404" x2="340" y2="425" class="arr" marker-end="url(#arrow)"/>
</svg>
