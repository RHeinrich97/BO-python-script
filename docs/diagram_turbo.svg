<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420">
  <title>TuRBO trust region adaptive cycle</title>
  <desc>Schema du cycle d'adaptation de la trust region TuRBO : initialisation, dilation apres succes, contraction apres echecs, restart si trop petite.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; fill: #555; }
      .arr { stroke: #555; stroke-width: 1.5; fill: none; }
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray text { fill: #2C2C2A; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue text { fill: #0C447C; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal text { fill: #085041; }
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber text { fill: #633806; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral text { fill: #4A1B0C; }
    </style>
  </defs>

  <g class="c-gray">
    <rect x="270" y="30" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="55" text-anchor="middle">Init L = 0.8</text>
    <text class="ts" x="340" y="73" text-anchor="middle">Centre = best point</text>
  </g>
  <g class="c-blue">
    <rect x="270" y="130" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="155" text-anchor="middle">Suggest dans TR</text>
    <text class="ts" x="340" y="173" text-anchor="middle">EI restreint a [lo, hi]</text>
  </g>
  <g class="c-blue">
    <rect x="270" y="220" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="245" text-anchor="middle">Observe y</text>
    <text class="ts" x="340" y="263" text-anchor="middle">Update success/fail</text>
  </g>
  <g class="c-teal">
    <rect x="50" y="320" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="345" text-anchor="middle">3 succes consecutifs</text>
    <text class="ts" x="140" y="363" text-anchor="middle">L *= 2 (max 1.6)</text>
  </g>
  <g class="c-amber">
    <rect x="250" y="320" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="345" text-anchor="middle">N echecs (≥ 4)</text>
    <text class="ts" x="340" y="363" text-anchor="middle">L /= 2</text>
  </g>
  <g class="c-coral">
    <rect x="450" y="320" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="540" y="345" text-anchor="middle">L &lt; L_min</text>
    <text class="ts" x="540" y="363" text-anchor="middle">Restart : nouveau LHS</text>
  </g>

  <line x1="340" y1="86" x2="340" y2="125" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="186" x2="340" y2="215" class="arr" marker-end="url(#arrow)"/>
  <path d="M310 280 L310 300 L140 300 L140 315" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="280" x2="340" y2="315" class="arr" marker-end="url(#arrow)"/>
  <path d="M370 280 L370 300 L540 300 L540 315" class="arr" marker-end="url(#arrow)"/>
  <path d="M140 376 L140 405 L460 405 L460 158 L415 158" class="arr" marker-end="url(#arrow)" opacity="0.5"/>
  <path d="M540 376 L540 405 L630 405 L630 58 L415 58" class="arr" marker-end="url(#arrow)" opacity="0.5"/>
</svg>
