<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>BO Chemistry</title>
<script src="plotly.min.js"></script>
<style>
/* ════════════════════════════════════════════════════════════
   DESIGN SYSTEM — dark sobre
   ════════════════════════════════════════════════════════════ */
:root {
  --bg:        #0a0a0b;
  --bg2:       #100f11;
  --bg3:       #1a181b;
  --card:      #121113;
  --card-h:    #18161a;
  --border:    #232026;
  --border-l:  #2e2a31;
  --text:      #f0eef2;
  --text-dim:  #a8a2ad;
  --text-faint:#6f6975;
  --accent:    #e8483d;
  --accent-h:  #ff5a4e;
  --accent-dim:#c13d34;
  --green:     #4ade80;
  --amber:     #fbbf24;
  --red:       #f87171;
  --violet:    #c084fc;
  --blue:      #60a5fa;
  --radius:    14px;
  --radius-s:  10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  overflow: hidden;
  height: 100vh;
}

#app { display: flex; height: 100vh; }

/* ── Sidebar ─────────────────────────────────────── */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 0;
}
.sidebar .logo {
  padding: 0 18px 18px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.2px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 11px;
}
.logo-dot {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; box-shadow: 0 2px 10px rgba(232,72,61,0.3);
}
.nav-item {
  padding: 10px 18px;
  margin: 1px 10px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 13.5px;
  border-radius: var(--radius-s);
  transition: all 0.13s;
  user-select: none;
  display: flex; align-items: center; gap: 10px;
}
.nav-item:hover { color: var(--text); background: var(--bg3); }
.nav-item.active {
  color: var(--text);
  background: linear-gradient(90deg, rgba(232,72,61,0.16), rgba(232,72,61,0.04));
  font-weight: 500;
}
.sidebar .campaigns-label {
  padding: 16px 18px 8px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-faint);
  font-weight: 600;
}
.sidebar-footer {
  margin-top: auto;
  padding: 14px 18px 0;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-faint);
  line-height: 1.7;
}

.lang-switch { display: flex; gap: 4px; margin-bottom: 10px; position: relative; z-index: 150; }  /* reste cliquable au-dessus des modales */
.lang-switch button {
  background: transparent; border: 1px solid var(--border); color: var(--text-faint);
  font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
}
.lang-switch button:hover { color: var(--text); }
.lang-switch button.on {
  color: var(--accent-h); border-color: var(--accent-dim); background: rgba(232,72,61,0.10);
}

/* ── Main content ─────────────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 28px 34px;
}
.main::-webkit-scrollbar { width: 10px; }
.main::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; }

h1 { font-size: 21px; font-weight: 600; margin-bottom: 4px; }
h2 { font-size: 15px; font-weight: 600; margin: 22px 0 12px; color: var(--text); }
.subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }

/* ── Cards & metrics ───────────────────────────────── */
.metrics { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.metric-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 22px;
  min-width: 150px;
}
.metric-card .label { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; }
.metric-card .value { font-size: 23px; font-weight: 600; margin-top: 5px; }
.metric-card .value.accent { color: var(--accent); }
.metric-card .value.green { color: var(--green); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
}

/* ── Campaign list ─────────────────────────────────── */
.camp-row {
  display: flex; align-items: center;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.camp-row:hover { border-color: var(--accent); }
.camp-row .camp-name { font-weight: 600; font-size: 14.5px; }
.camp-row .camp-stats { color: var(--text-dim); font-size: 12.5px; margin-left: 14px; }
.camp-row .spacer { flex: 1; }
.camp-row .del-btn {
  color: var(--text-faint); font-size: 12px; padding: 5px 11px;
  border-radius: 6px; border: 1px solid transparent;
}
.camp-row .del-btn:hover { color: var(--red); border-color: var(--red); }

/* ── Buttons ──────────────────────────────────────── */
button {
  font-family: inherit;
  font-size: 13px;
  border: none;
  cursor: pointer;
  border-radius: var(--radius-s);
  transition: background 0.15s, opacity 0.15s;
}
.btn-primary {
  background: var(--accent); color: white;
  padding: 9px 20px; font-weight: 500;
}
.btn-primary:hover { background: var(--accent-h); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 8px 16px;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }
.btn-green { background: var(--green); color: white; padding: 9px 20px; font-weight: 500; }
.btn-green:hover { filter: brightness(1.1); }

/* ── Table ────────────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 420px;
  overflow-y: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { position: sticky; top: 0; z-index: 2; }
th {
  background: var(--bg3);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr.row-suggested { background: rgba(232,72,61,0.05); }
tr.row-done td { color: var(--text); }
td.cell-ro { color: var(--text-dim); }
td input {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 9px;
  border-radius: 6px;
  width: 88px;
  font-size: 13px;
  font-family: inherit;
}
td input:focus { outline: none; border-color: var(--accent); }
.statut-badge {
  font-size: 11px; padding: 2.5px 9px; border-radius: 20px; font-weight: 500;
}
.statut-fait    { background: rgba(74,222,128,0.13); color: var(--green); }
.statut-suggere { background: rgba(232,72,61,0.13);  color: var(--accent-h); }
.row-del {
  background: transparent; color: var(--text-faint); font-size: 13px;
  padding: 3px 8px; border-radius: 6px; line-height: 1;
}
.row-del:hover { color: var(--red); background: rgba(248,113,113,0.1); }
.rename-link {
  font-size: 15px; color: var(--text-faint); cursor: pointer;
  margin-left: 8px; vertical-align: middle;
}
.rename-link:hover { color: var(--accent-h); }
.dup-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); padding: 5px 12px; border-radius: 6px;
  font-size: 12px; margin-right: 8px;
}
.dup-btn:hover { border-color: var(--accent-dim); color: var(--accent-h); }
.recap-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-s); padding: 14px 16px; margin: 18px 0 4px;
}
.recap-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--text-faint); margin-bottom: 8px;
}
.recap-line { font-size: 13px; color: var(--text-dim); margin: 3px 0; }
.recap-highlight { color: var(--text); margin-top: 7px; }
.recap-highlight strong { color: var(--accent-h); }
.recap-warn {
  margin-top: 9px; padding: 8px 11px; border-radius: 6px;
  background: rgba(245,180,80,0.1); border: 1px solid rgba(245,180,80,0.3);
  color: var(--amber); font-size: 12.5px;
}
.name-warn {
  margin-top: 6px; font-size: 12.5px; color: var(--amber);
}
.form-error {
  margin: 12px 0 4px; padding: 10px 13px; border-radius: 6px;
  background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.4);
  color: #f87171; font-size: 13px; font-weight: 500;
}
.config-panel {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
}
.config-panel summary {
  cursor: pointer; padding: 14px 20px; font-size: 13px; font-weight: 600;
  color: var(--text-dim); user-select: none; list-style: none;
}
.config-panel summary::-webkit-details-marker { display: none; }
.config-panel summary::before { content: '▸ '; color: var(--accent); }
.config-panel[open] summary::before { content: '▾ '; }
.config-panel summary:hover { color: var(--text); }
.config-body { padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.cfg-section .cfg-h {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text-faint); margin-bottom: 6px;
}
.cfg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cfg-table td { padding: 5px 10px 5px 0; color: var(--text-dim); vertical-align: top; }
.cfg-table td:first-child { color: var(--text); font-weight: 500; width: 180px; }
.cfg-table td:nth-child(2) { width: 110px; }
.cfg-tag {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px;
  background: rgba(232,72,61,0.12); color: var(--accent-h); margin-left: 4px;
}
.cfg-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-dim); }
.cfg-list li { margin: 3px 0; }
.log-toggle {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font-size: 12px; color: var(--text-dim); padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 6px; user-select: none;
}
.log-toggle:hover { border-color: var(--border-l); color: var(--text); }
.log-toggle.on { background: rgba(232,72,61,0.12); border-color: var(--accent-dim); color: var(--accent-h); }
.log-toggle input { accent-color: var(--accent); margin: 0; }
.constraint-block {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-s); padding: 12px 14px; margin: 8px 0;
}
.constraint-label { font-size: 12px; color: var(--text-faint); margin-bottom: 8px; }
.constraint-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap;
}
.constraint-row select, .constraint-row input {
  padding: 5px 8px; font-size: 12.5px;
}
.minmax-group { display: flex; align-items: center; gap: 8px; }
.minmax-group input { width: 90px; }
.minmax-arrow { color: var(--text-faint); font-size: 14px; }
.bound-min {
  border-color: rgba(232,72,61,0.45) !important;
}
.bound-min:focus { border-color: var(--accent) !important; }
.bound-max {
  border-color: rgba(96,165,250,0.45) !important;
}
.bound-max:focus { border-color: var(--blue) !important; }
.bound-min::placeholder { color: rgba(232,72,61,0.5); }
.bound-max::placeholder { color: rgba(96,165,250,0.5); }

/* ── Controls panel ───────────────────────────────── */
.controls { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; }
.field input[type=number], .field select, .field input[type=text] {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: var(--radius-s);
  font-size: 13.5px;
  font-family: inherit;
  min-width: 110px;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.field input[type=range] { accent-color: var(--accent); min-width: 140px; }
.range-val { font-size: 12px; color: var(--accent); font-weight: 600; }

/* Toggle switch */
.toggle-wrap { display: flex; align-items: center; gap: 10px; }
.toggle {
  position: relative; width: 42px; height: 23px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; cursor: pointer; transition: background 0.2s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle .knob {
  position: absolute; top: 2px; left: 2px;
  width: 17px; height: 17px; background: white; border-radius: 50%;
  transition: left 0.2s;
}
.toggle.on .knob { left: 21px; }
.toggle-label { font-size: 13px; }

/* ── Badges (logs structures) ─────────────────────── */
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.badge {
  font-size: 12px; padding: 4.5px 12px; border-radius: 20px;
  font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-phase      { background: rgba(232,72,61,0.14);  color: var(--accent-h); }
.badge-progress   { background: rgba(74,222,128,0.13);  color: var(--green); }
.badge-coverage   { background: rgba(192,132,252,0.13); color: var(--violet); }
.badge-noise      { background: rgba(251,191,36,0.13);  color: var(--amber); }
.badge-xi         { background: rgba(251,191,36,0.13);  color: var(--amber); }
.badge-ucb        { background: rgba(251,191,36,0.13);  color: var(--amber); }
.badge-turbo      { background: rgba(192,132,252,0.13); color: var(--violet); }
.badge-stagnation { background: rgba(248,113,113,0.13); color: var(--red); }
.badge-drift      { background: rgba(248,113,113,0.13); color: var(--red); }
.badge-init       { background: rgba(74,222,128,0.13);  color: var(--green); }
.badge-autopilot  { background: rgba(232,72,61,0.14);   color: var(--accent-h); }
.badge-hedge      { background: rgba(192,132,252,0.13); color: var(--violet); }
.badge-convergence{ background: rgba(74,222,128,0.13);  color: var(--green); }

/* ── Console (log brut) ───────────────────────────── */
details.console { margin-top: 10px; }
details.console summary {
  cursor: pointer; font-size: 12.5px; color: var(--text-dim);
  user-select: none; padding: 4px 0;
}
details.console summary:hover { color: var(--text); }
.console-body {
  background: #0a0d12;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 14px 16px;
  font-family: 'Cascadia Code', 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.65;
  color: #b6c2cf;
  max-height: 320px;
  overflow-y: auto;
  white-space: pre-wrap;
  margin-top: 8px;
}
.console-body::-webkit-scrollbar { width: 8px; }
.console-body::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }

/* ── Graphes ──────────────────────────────────────── */
.graph-toggles { display: flex; gap: 20px; margin-bottom: 14px; }
.check-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-dim); user-select: none; }
.check-wrap input { accent-color: var(--accent); width: 15px; height: 15px; }
.check-wrap:hover { color: var(--text); }
.plot-box { width: 100%; min-height: 100px; }

/* ── Modal / formulaire ──────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px 30px;
  width: 620px;
  max-height: 85vh;
  overflow-y: auto;
}
.modal h2 { margin-top: 0; }
.param-block {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-s); padding: 14px; margin-bottom: 10px;
  display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
}
.compound-list {
  display: flex; flex-wrap: wrap; gap: 7px;
  max-height: 160px; overflow-y: auto; padding: 4px 2px;
}
.compound-list::-webkit-scrollbar { width: 7px; }
.compound-list::-webkit-scrollbar-thumb { background: var(--border-l); border-radius: 4px; }
.compound-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 20px;
  background: var(--bg2); border: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-dim); cursor: pointer;
  user-select: none; transition: all 0.12s;
}
.compound-chip:hover { border-color: var(--border-l); color: var(--text); }
.compound-chip.on {
  background: rgba(232,72,61,0.12); border-color: var(--accent-dim);
  color: var(--accent-h);
}
.compound-chip input { accent-color: var(--accent); width: 13px; height: 13px; margin: 0; }
.modal .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; }
textarea.yaml-input {
  width: 100%; height: 220px;
  background: #0a0d12; border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-s);
  padding: 12px; font-family: 'Consolas', monospace; font-size: 12.5px;
  resize: vertical;
}
textarea.yaml-input:focus { outline: none; border-color: var(--accent); }

/* ── Spinner ──────────────────────────────────────── */
.spinner {
  width: 17px; height: 17px;
  border: 2.5px solid rgba(255,255,255,0.25);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
  vertical-align: -3px;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 26px; right: 26px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 12px 20px; font-size: 13.5px;
  opacity: 0; transform: translateY(8px);
  transition: all 0.25s; pointer-events: none; z-index: 200;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { border-left: 3px solid var(--green); }
#toast.error { border-left: 3px solid var(--red); }

.hidden { display: none !important; }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); font-size: 12.5px; }
</style>
</head>
<body>

<div id="app">
  <!-- ═══════════ SIDEBAR ═══════════ -->
  <div class="sidebar">
    <div class="logo"><div class="logo-dot">⚗</div>BO Chemistry</div>
    <div class="nav-item active" id="nav-home" onclick="goHome()" data-i18n="Campagnes">Campagnes</div>
    <div class="campaigns-label" data-i18n="Récentes">Récentes</div>
    <div id="sidebar-campaigns"></div>
    <div class="sidebar-footer">
      <div class="lang-switch" title="Langue / Language">
        <button id="lang-fr" onclick="setLang('fr')">FR</button>
        <button id="lang-en" onclick="setLang('en')">EN</button>
      </div>
      bo_chemistry.py v3.9<br>
      <span data-i18n="interface locale">interface locale</span>
    </div>
  </div>

  <!-- ═══════════ MAIN ═══════════ -->
  <div class="main" id="main"></div>
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════
   ETAT GLOBAL
   ════════════════════════════════════════════════════════════ */
let API = null;
let currentCampaign = null;
let campaignData = null;        // donnees de la campagne ouverte
let lastSuggestLog = null;      // dernier log de suggestion
let lastSuggestBadges = [];

/* ════════════════════════════════════════════════════════════
   LANGUE (FR / EN)
   Les cles sont les textes francais : en mode FR, t() renvoie la cle
   telle quelle ; en mode EN, sa traduction dans I18N_EN.
   ════════════════════════════════════════════════════════════ */
let LANG = 'fr';
const I18N_EN = {
  "+ Ajouter une ligne (prior)": "+ Add a row (prior)",
  "+ Nouvelle campagne": "+ New campaign",
  "+ contrainte sur paramètres": "+ constraint on parameters",
  "+ contrainte sur résultats": "+ constraint on results",
  "+ objectif": "+ objective",
  "+ variable catégorielle": "+ categorical variable",
  "+ variable continue": "+ continuous variable",
  ", catégoriel jusqu'à {k} niveaux": ", categorical up to {k} levels",

function t(s, vars) {
  let out = (LANG === 'en' && Object.prototype.hasOwnProperty.call(I18N_EN, s)) ? I18N_EN[s] : s;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return out;
}

/* Pluriel : FR -> pluriel si n > 1 ; EN -> pluriel si n != 1 */
function tn(n, one, many, vars) {
  const plural = LANG === 'en' ? n !== 1 : n > 1;
  return t(plural ? many : one, Object.assign({ n: n }, vars || {}));
}

function contName(c) { return (LANG === 'en' && c.name_en) ? c.name_en : c.name; }
function catLabel(c) { return (LANG === 'en' && c.label_en) ? c.label_en : c.label; }
function objName(o) { return (LANG === 'en' && o.name_en) ? o.name_en : o.name; }

function applyStaticI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  for (const l of ['fr', 'en']) {
    const b = document.getElementById('lang-' + l);
    if (b) b.classList.toggle('on', LANG === l);
  }
}

/* Recopie les resultats saisis (non sauvegardes) avant un re-rendu */
function syncResultInputs() {
  if (!campaignData) return;
  document.querySelectorAll('.result-input').forEach(inp => {
    const i = parseInt(inp.dataset.row);
    if (campaignData.rows[i]) campaignData.rows[i][inp.dataset.col] = inp.value === '' ? null : parseFloat(inp.value);
  });
}

async function setLang(lang, persist = true) {
  if ((lang !== 'fr' && lang !== 'en') || (lang === LANG && persist)) return;
  const createOpen = !!document.getElementById('c-name');
  if (createOpen) {
    const el = document.getElementById('c-name');
    createName = el.value;
  }
  LANG = lang;
  applyStaticI18n();
  const tst = document.getElementById('toast');
  if (tst) { tst.className = ''; tst.textContent = ''; }   // ne pas laisser un message dans l'ancienne langue
  if (persist && API) { try { await API.set_language(lang); } catch (e) { /* non bloquant */ } }
  // Re-rendre la vue courante dans la nouvelle langue
  if (currentCampaign && campaignData) {
    syncResultInputs();
    renderCampaign();
  } else if (API) {
    await goHome();
    if (createOpen) renderCreateModal();
  }
}

  if (lang !== 'fr' && lang !== 'en') {
    lang = String(navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';

});

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => { t.className = ''; }, 2800);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtNum(v, dec=2) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  return isNaN(n) ? esc(v) : n.toFixed(dec).replace(/\.?0+$/, m => m.includes('.') ? '' : m);
}

  renderSidebar(camps);

  if (camps.length === 0) {
    rows = `<p class="dim" style="padding:30px 0">${t("Aucune campagne. Crée-en une ci-dessous.")}</p>`;
  } else {
    for (const c of camps) {
      const best = c.best !== null ? `best ${fmtNum(c.best)}` : t("vide");
      rows += `
        <div class="camp-row" onclick="openCampaign('${esc(c.name)}')">
          <span class="camp-name">${esc(c.name)}</span>
          <span class="camp-stats">${c.n_done} exp · ${best}</span>

          <button class="dup-btn" onclick="event.stopPropagation(); duplicateCampaign('${esc(c.name)}')" title="${t("Créer une nouvelle campagne avec les mêmes paramètres")}">${t("Dupliquer")}</button>
          <button class="del-btn" onclick="event.stopPropagation(); deleteCampaign('${esc(c.name)}')">${t("Supprimer")}</button>
        </div>`;

  document.getElementById('main').innerHTML = `

    <p class="subtitle">${t("Optimisation bayésienne — sélectionne ou crée une campagne")}</p>
    ${rows}
    <div style="display:flex; gap:12px; margin-top:22px">

      <button class="btn-ghost" onclick="showImportModal()">${t("Importer un YAML")}</button>

}

async function deleteCampaign(name) {
  if (!confirm(t("Supprimer définitivement '{name}' ?", {name}))) return;
  const res = await API.delete_campaign(name);
  if (res && res.ok === false) {
    toast(res.error || t("Échec de la suppression"), 'error');
    return;
  }
  toast(t("Campagne '{name}' supprimée", {name}));
  goHome();
}

async function duplicateCampaign(name) {
  // Charge la config existante et pré-remplit le formulaire de création
  if (!presetsCache) presetsCache = await API.get_presets();
  await refreshCampaignNames();
  const d = await API.get_campaign(name);
  if (!d.ok) { toast(d.error || t("Erreur"), 'error'); return; }
  const cfg = d.cfg;

  // Reconstruire createParams depuis cfg.parameters
  createParams = cfg.parameters.map(p => {
    if (p.type === 'continuous') {
      // retrouver un preset continu correspondant (par nom), sinon custom
      const preset = presetsCache.continuous.find(c => c.name === p.name || c.name_en === p.name);
      const isLog = p.encoding === 'log_ratio';
      return {
        mode: preset ? 'preset_cont' : 'custom_cont',
        preset: preset ? preset.name : null,
        type: 'continuous', name: p.name,
        unit: preset ? preset.unit : '',
        min: p.min, max: p.max,
        ph_min: preset ? preset.ph_min : null,
        ph_max: preset ? preset.ph_max : null,
        log_ok: isLog || !!(preset && preset.log_ok), useLog: isLog,
      };
    } else {
      // catégoriel : avec descripteurs (bibliothèque) ou one-hot
      if (p.descriptors_file && p.descriptors_sheet) {
        const sel = {};
        (p.categories || []).forEach(c => { sel[c] = true; });
        return {
          mode: 'preset_cat', type: 'categorical',
          sheet: p.descriptors_sheet, name: p.name, use_lib: true,
          descriptors_columns: p.descriptors_columns || [],
          selected: sel,
          _needsSheet: true,  // signal pour charger la feuille complète
        };
      } else {
        return {
          mode: 'custom_cat', type: 'categorical',
          name: p.name, categories: (p.categories || []).join(', '),
          use_lib: false,
        };
      }
    }
  });

  // Reconstruire createObjectives depuis cfg.outputs
  createObjectives = cfg.outputs.map(o => ({
    name: o.name, direction: o.direction || 'maximize',
    max: (o.max != null ? o.max : null), weight: o.weight || 1.0,
  }));

  // Charger les feuilles complètes de la bibliothèque pour les catégoriels
  // à descripteurs (permet d'ajouter/retirer des composés, ex: multi-substrats)
  for (const p of createParams) {
    if (p.mode === 'preset_cat' && p._needsSheet) {
      if (!sheetCache[p.sheet]) {
        const res = await API.get_library_sheet(p.sheet);
        if (res.ok) sheetCache[p.sheet] = res;
        else sheetCache[p.sheet] = { compounds: Object.keys(p.selected),
                                     descriptor_columns: p.descriptors_columns };
      }
      // s'assurer que les composés sélectionnés de l'original restent cochés
      // (même s'ils sont déjà dans la feuille) ; les autres décochés
      const full = {};
      (sheetCache[p.sheet].compounds || []).forEach(c => {
        full[c] = !!p.selected[c];
      });
      // garder aussi ceux de l'original au cas où absents de la feuille
      Object.keys(p.selected).forEach(c => { if (!(c in full)) full[c] = true; });
      p.selected = full;
      delete p._needsSheet;
    }
  }

  createName = name + (LANG === 'en' ? '_copy' : '_copie');
  createTarget = 95;
  createNoisePrior = cfg.noise_prior || 'low';
  createConstraints = [];
  createSoftConstraints = [];
  renderCreateModal();
  setTimeout(() => {
    const el = document.getElementById('c-name');
    if (el) checkNameCollision(el.value);
  }, 0);
  toast(t("Formulaire pré-rempli — ajuste et crée"));
}

function safeName(raw) {
  // Réplique safe_campaign_name côté backend (pour comparer les noms)
  return String(raw || '').trim();
}

function checkNameCollision(value) {
  const el = document.getElementById('name-warn');
  if (!el) return;
  const name = safeName(value);
  const collision = existingCampaignNames.some(n => n.toLowerCase() === name.toLowerCase());
  if (collision) {
    el.style.display = 'block';
    el.textContent = '⚠ ' + t("Une campagne nommée « {name} » existe déjà. Choisis un autre nom.", {name});
  } else {
    el.style.display = 'none';
  }
}

  return `
    <select onchange="onTypeChange(${i}, this.value)">
      <optgroup label="${t("Variable continue")}">
        ${cont}
        <option value="cont:__custom__" ${p.mode==='custom_cont'?'selected':''}>${t("Continue personnalisée…")}</option>
      </optgroup>
      <optgroup label="${t("Variable catégorielle")}">
        ${cat}
        <option value="cat:__custom__" ${p.mode==='custom_cat'?'selected':''}>${t("Catégorielle personnalisée…")}</option>
      </optgroup>
    </select>`;
}

async function onTypeChange(i, value) {
  const [kind, key] = value.split(':');
  const p = createParams[i];
  if (kind === 'cont') {
    if (key === '__custom__') {
      Object.assign(p, { mode: 'custom_cont', type: 'continuous',
        name: '', unit: '', min: '', max: '', ph_min: null, ph_max: null,
        log_ok: false, useLog: false });
    } else {
      const preset = presetsCache.continuous.find(c => c.name === key);
      Object.assign(p, { mode: 'preset_cont', preset: key, type: 'continuous',
        name: contName(preset), unit: preset.unit, min: '', max: '',
        ph_min: preset.ph_min, ph_max: preset.ph_max,
        log_ok: !!preset.log_ok, useLog: false });
    }
  } else { // cat
    if (key === '__custom__') {
      Object.assign(p, { mode: 'custom_cat', type: 'categorical',
        name: '', categories: '', use_lib: false });
    } else {
      // Charger la feuille de la bibliotheque
      if (!sheetCache[key]) {
        const res = await API.get_library_sheet(key);
        if (res.ok) sheetCache[key] = res;
        else { formError(res.error); return; }
      }
      const sheet = sheetCache[key];
      const catPreset = presetsCache.categorical.find(c => c.sheet === key);
      const label = catPreset ? catLabel(catPreset) : key;
      Object.assign(p, { mode: 'preset_cat', type: 'categorical', sheet: key,
        name: label, use_lib: true,
        descriptors_columns: sheet.descriptor_columns.slice(),
        selected: {} });   // rien de coche par defaut : l'utilisateur choisit
    }
  }
  renderCreateModal();
}

function toggleCompound(i, compound, checked) {
  createParams[i].selected[compound] = checked;
  // Mise a jour ciblee (sans re-render complet, pour ne pas perdre le scroll)
  updateCompoundCount(i);
  updateRecap();
}

function updateCompoundCount(i) {
  const p = createParams[i];
  const el = document.getElementById('compound-count-' + i);
  if (!el) return;
  const nSel = Object.values(p.selected || {}).filter(Boolean).length;
  const selColor = (nSel < 2 || nSel > 8) ? 'var(--amber)' : 'var(--green)';
  const selHint = nSel < 2 ? ' (' + t("coche au moins 2") + ')' :
                  (nSel > 8 ? ' (' + t("beaucoup — plan initial élevé") + ')' : '');
  el.style.color = selColor;
  el.textContent = `${tn(nSel, '{n} composé sélectionné', '{n} composés sélectionnés')}${selHint}`;
}

function updateRecap() {
  const box = document.getElementById('recap-zone');
  if (!box) return;
  box.innerHTML = buildRecapHtml();
}

function buildConstraintsHtml() {
  const contNames = createParams.filter(p => p.type === 'continuous' && p.name).map(p => p.name);
  const objNames = createObjectives.map(o => o.name).filter(Boolean);

  // ── Hard constraints : relations entre paramètres ──
  const hardRows = createConstraints.map((c, i) => {
    const opts = contNames.map(n => `<option value="${esc(n)}" ${c.pa===n?'selected':''}>${esc(n)}</option>`).join('');
    // membre droit : soit une valeur, soit un autre paramètre
    const rhsParamOpts = contNames.map(n => `<option value="param:${esc(n)}" ${c.rhs==='param:'+n?'selected':''}>${esc(n)}</option>`).join('');
    return `
      <div class="constraint-row">
        <select onchange="createConstraints[${i}].pa=this.value">${opts}</select>
        <select onchange="createConstraints[${i}].op=this.value; renderConstraints()">
          <option value="<=" ${c.op==='<='?'selected':''}>≤</option>
          <option value=">=" ${c.op==='>='?'selected':''}>≥</option>
        </select>
        <select onchange="createConstraints[${i}].rhsType=this.value; renderConstraints()">
          <option value="value" ${c.rhsType==='value'?'selected':''}>${t("valeur")}</option>
          <option value="param" ${c.rhsType==='param'?'selected':''}>${t("paramètre")}</option>
          <option value="sum" ${c.rhsType==='sum'?'selected':''}>${t("somme avec…")}</option>
        </select>
        ${c.rhsType === 'param'
          ? `<select onchange="createConstraints[${i}].rhsParam=this.value">${contNames.map(n=>`<option value="${esc(n)}" ${c.rhsParam===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`
          : c.rhsType === 'sum'
          ? `<select onchange="createConstraints[${i}].rhsParam=this.value">${contNames.map(n=>`<option value="${esc(n)}" ${c.rhsParam===n?'selected':''}>+ ${esc(n)}</option>`).join('')}</select>
             <span class="faint">${c.op==='>='?'≥':'≤'}</span>
             <input type="number" step="any" value="${c.val!=null?c.val:''}" placeholder="${t("seuil")}" style="width:80px" onchange="createConstraints[${i}].val=this.value">`
          : `<input type="number" step="any" value="${c.val!=null?c.val:''}" placeholder="${t("valeur")}" style="width:90px" onchange="createConstraints[${i}].val=this.value">`}
        <button class="row-del" onclick="createConstraints.splice(${i},1); renderConstraints()">✕</button>
      </div>`;
  }).join('');

  // ── Soft constraints : limite sur une sortie mesurée ──
  const softRows = createSoftConstraints.map((c, i) => {
    const opts = objNames.map(n => `<option value="${esc(n)}" ${c.output===n?'selected':''}>${esc(n)}</option>`).join('');
    return `
      <div class="constraint-row">
        <select onchange="createSoftConstraints[${i}].output=this.value">${opts}</select>
        <span class="faint">${t("doit rester")}</span>
        <select onchange="createSoftConstraints[${i}].direction=this.value">
          <option value="minimize" ${c.direction==='minimize'?'selected':''}>≤ (${t("sous")})</option>
          <option value="maximize" ${c.direction==='maximize'?'selected':''}>≥ (${t("au-dessus de")})</option>
        </select>
        <input type="number" step="any" value="${c.threshold!=null?c.threshold:''}" placeholder="${t("seuil")}" style="width:90px" onchange="createSoftConstraints[${i}].threshold=this.value">
        <button class="row-del" onclick="createSoftConstraints.splice(${i},1); renderConstraints()">✕</button>
      </div>`;
  }).join('');

  const canHard = contNames.length >= 1;
  const canSoft = objNames.length >= 1;

  return `
    <h2 style="font-size:13px">${t("Contraintes")} <span class="faint" style="font-weight:400">(${t("optionnel")})</span></h2>
    <div class="constraint-block">
      <div class="constraint-label">${t("Sur les paramètres (connues d'avance — excluent des combinaisons infaisables)")}</div>
      ${hardRows || '<div class="faint" style="font-size:12px; margin:4px 0">' + t("Aucune contrainte.") + '</div>'}
      ${canHard ? `<button class="btn-ghost" style="font-size:12px; padding:5px 11px" onclick="addHardConstraint()">${t("+ contrainte sur paramètres")}</button>`
                : `<span class="faint" style="font-size:12px">${t("Ajoute au moins une variable continue pour définir une contrainte.")}</span>`}
    </div>
    <div class="constraint-block">
      <div class="constraint-label">${t("Sur les résultats (mesurés — ex : limiter un sous-produit tout en l'optimisant)")}</div>
      ${softRows || '<div class="faint" style="font-size:12px; margin:4px 0">' + t("Aucune contrainte.") + '</div>'}
      ${canSoft ? `<button class="btn-ghost" style="font-size:12px; padding:5px 11px" onclick="addSoftConstraint()">${t("+ contrainte sur résultats")}</button>` : ''}
    </div>`;
}

function renderConstraints() {
  const z = document.getElementById('constraints-zone');
  if (z) z.innerHTML = buildConstraintsHtml();
}

function addHardConstraint() {
  const contNames = createParams.filter(p => p.type === 'continuous' && p.name).map(p => p.name);
  createConstraints.push({ pa: contNames[0] || '', op: '<=', rhsType: 'value',
    rhsParam: contNames[0] || '', val: '' });
  renderConstraints();
}

function addSoftConstraint() {
  const objNames = createObjectives.map(o => o.name).filter(Boolean);
  createSoftConstraints.push({ output: objNames[0] || '', direction: 'minimize', threshold: '' });
  renderConstraints();
}

function buildRecapHtml() {
  const est = estimateInitialPlan(createParams);
  const nParams = createParams.length;
  const paramSummary = tn(nParams, '{n} paramètre', '{n} paramètres') + ' (' +
    tn(est.nCont, '{n} continu', '{n} continus') +
    (est.nCatMax > 0 ? t(", catégoriel jusqu'à {k} niveaux", {k: est.nCatMax}) : '') + ')';
  const objSummary = tn(createObjectives.length, '{n} objectif', '{n} objectifs') +
    (createObjectives.length > 1 ? ' (' + t("multi-objectif, EHVI") + ')' : '');
  let initWarn = '';
  if (est.nInit >= 16) {
    initWarn = '<div class="recap-warn">⚠ ' + esc(t("Plan initial conséquent ({k} expériences). Beaucoup de paramètres ou de niveaux — envisage d'en fixer certains si possible.", {k: est.nInit})) + '</div>';
  }
  return `
    <div class="recap-box">
      <div class="recap-title">${t("Récapitulatif")}</div>
      <div class="recap-line">${esc(paramSummary)}</div>
      <div class="recap-line">${esc(objSummary)}</div>
      <div class="recap-line recap-highlight">
        ${t("Plan initial estimé :")} <strong>${tn(est.nInit, '{n} expérience', '{n} expériences')}</strong> (LHS)
        <span class="faint">${t("— à réaliser avant les premières suggestions BO")}</span>
      </div>
      ${initWarn}
    </div>`;
}

function estimateInitialPlan(params) {
  // Réplique le scaling de generate_lhs_design (v3.9) côté backend
  let nCont = 0, nCatMax = 0;
  for (const p of params) {
    if (p.type === 'continuous') {
      nCont++;
    } else {
      let nCat = 0;
      if (p.mode === 'preset_cat') nCat = Object.values(p.selected||{}).filter(Boolean).length;
      else nCat = String(p.categories||'').split(',').map(s=>s.trim()).filter(Boolean).length;
      nCatMax = Math.max(nCatMax, nCat);
    }
  }
  let base = Math.max(2*(nCont+1), 3*nCont, 5);
  if (nCatMax > 0) base = Math.max(base, nCatMax, Math.ceil(1.5*nCatMax));
  const nInit = Math.min(base, 24);
  return { nInit, nCont, nCatMax };
}

function addParam(kind) {
  if (kind === 'cont') {
    const preset = presetsCache.continuous[0];
    createParams.push({ mode: 'preset_cont', preset: preset.name, type: 'continuous',
      name: contName(preset), unit: preset.unit, min: '', max: '',
      ph_min: preset.ph_min, ph_max: preset.ph_max,
      log_ok: !!preset.log_ok, useLog: false });
  } else {
    createParams.push({ mode: 'custom_cat', type: 'categorical',
      name: '', categories: '', use_lib: false });
  }
  renderCreateModal();
}

function addObjective() {
  // proposer un preset non encore utilisé
  const used = new Set(createObjectives.map(o => o.name));
  const next = OBJECTIVE_PRESETS.find(p => !used.has(objName(p))) || OBJECTIVE_PRESETS[0];
  createObjectives.push({ name: objName(next), direction: next.direction,
    max: next.max, weight: 1.0 });
  renderCreateModal();
}

function formError(msg) {
  const el = document.getElementById('form-error');
  if (el) {
    el.style.display = 'block';
    el.textContent = '⚠ ' + msg;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  toast(msg, 'error');
}

function clearFormError() {
  const el = document.getElementById('form-error');
  if (el) el.style.display = 'none';
}

async function submitCreate() {
  clearFormError();
  const params = [];
  for (const p of createParams) {
    if (p.type === 'continuous') {
      // bornes : valeur saisie sinon placeholder
      const mn = p.min !== '' ? parseFloat(p.min) : (p.ph_min != null ? p.ph_min : null);
      const mx = p.max !== '' ? parseFloat(p.max) : (p.ph_max != null ? p.ph_max : null);
      if (mn === null || mx === null) {
        formError(t("Paramètre '{p}' : min et max requis", {p: p.name||'?'})); return;
      }
      const prm = { name: p.name, type: 'continuous', min: mn, max: mx };
      if (p.useLog) {
        if (mn <= 0) {
          formError(t("Paramètre '{p}' : échelle log impossible avec une borne ≤ 0", {p: p.name}));
          return;
        }
        prm.encoding = 'log_ratio';
      }
      params.push(prm);
    } else if (p.mode === 'preset_cat') {
      const chosen = Object.keys(p.selected).filter(c => p.selected[c]);
      if (chosen.length < 2) {
        formError(t("Paramètre '{p}' : coche au moins 2 composés", {p: p.name})); return;
      }
      params.push({ name: p.name, type: 'categorical', categories: chosen,
        use_library_descriptors: true, descriptors_sheet: p.sheet,
        descriptors_columns: p.descriptors_columns });
    } else {
      const cats = String(p.categories||'').split(',').map(s=>s.trim()).filter(Boolean);
      if (cats.length < 2) {
        formError(t("Paramètre '{p}' : au moins 2 catégories", {p: p.name||'?'})); return;
      }
      params.push({ name: p.name, type: 'categorical', categories: cats });
    }
  }

  // Objectifs
  const objectives = [];
  const objNames = new Set();
  for (const o of createObjectives) {
    const nm = (o.name||'').trim();
    if (!nm) { formError(t("Tout objectif doit avoir un nom")); return; }
    if (objNames.has(nm)) { formError(t("Objectif dupliqué : '{o}'", {o: nm})); return; }
    objNames.add(nm);
    const obj = { name: nm, direction: o.direction, weight: o.weight || 1.0 };
    if (o.max != null) obj.max = o.max;
    objectives.push(obj);
  }

  // Compiler les contraintes hard en expressions Python
  const constraints = [];
  for (const c of createConstraints) {
    if (!c.pa) continue;
    const opPy = c.op; // '<=' ou '>='
    if (c.rhsType === 'value') {
      if (c.val === '' || c.val == null) {
        formError(t("Contrainte sur '{p}' : valeur manquante", {p: c.pa})); return;
      }
      constraints.push(`${c.pa} ${opPy} ${parseFloat(c.val)}`);
    } else if (c.rhsType === 'param') {
      if (!c.rhsParam) { formError(t("Contrainte : paramètre de droite manquant")); return; }
      constraints.push(`${c.pa} ${opPy} ${c.rhsParam}`);
    } else if (c.rhsType === 'sum') {
      if (!c.rhsParam || c.val === '' || c.val == null) {
        formError(t("Contrainte somme : paramètre et seuil requis")); return;
      }
      // somme bornée : pa + rhsParam (<=|>=) val, selon l'opérateur choisi
      constraints.push(`${c.pa} + ${c.rhsParam} ${opPy} ${parseFloat(c.val)}`);
    }
  }

  // Compiler les soft constraints
  const soft_constraints = [];
  for (const c of createSoftConstraints) {
    if (!c.output) continue;
    if (c.threshold === '' || c.threshold == null) {
      formError(t("Contrainte sur '{p}' : seuil manquant", {p: c.output})); return;
    }
    soft_constraints.push({
      name: `${c.output} ${c.direction==='minimize'?'≤':'≥'} ${c.threshold}`,
      output: c.output, direction: c.direction, threshold: parseFloat(c.threshold),
    });
  }

  const campName = document.getElementById('c-name').value;
  createName = campName;
  // Rafraichir la liste avant de valider (evite un cache perime apres
  // suppression/creation d'autres campagnes pendant que le formulaire est ouvert)
  await refreshCampaignNames();
  const nameClean = safeName(campName).toLowerCase();
  if (existingCampaignNames.some(n => n.toLowerCase() === nameClean)) {
    formError(t("Une campagne nommée « {name} » existe déjà", {name: safeName(campName)}));
    checkNameCollision(campName);
    return;
  }

  const payload = {
    name: campName,
    parameters: params,
    objectives: objectives,
    autopilot: true,
    target: parseFloat(document.getElementById('c-target').value),
    noise_prior: createNoisePrior,
  };
  if (constraints.length) payload.constraints = constraints;
  if (soft_constraints.length) payload.soft_constraints = soft_constraints;
  const res = await API.create_campaign(JSON.stringify(payload));
  if (res.ok) { toast(t("Campagne '{name}' créée", {name: res.name})); openCampaign(res.name); }
  else formError(res.error || t("Création impossible"));
}

async function openCampaign(name) {
  currentCampaign = name;
  document.getElementById('nav-home').classList.remove('active');
  const data = await API.get_campaign(name);
  if (!data.ok) { toast(data.error, 'error'); return goHome(); }

}

function buildConfigPanel(cfg) {
  // Paramètres
  const paramRows = cfg.parameters.map(p => {
    if (p.type === 'continuous') {
      const logTag = p.encoding === 'log_ratio'
        ? ' <span class="cfg-tag">' + t("échelle log") + '</span>' : '';
      return `<tr><td>${esc(p.name)}</td><td>${t("continu")}</td>
        <td>${fmtNum(p.min)} → ${fmtNum(p.max)}${logTag}</td></tr>`;
    } else {
      const cats = (p.categories || []).join(', ');
      const desc = (p.descriptors_columns && p.descriptors_columns.length)
        ? ` <span class="cfg-tag">${t("descripteurs")}: ${p.descriptors_columns.map(esc).join(', ')}</span>`
        : ' <span class="cfg-tag">one-hot</span>';
      return `<tr><td>${esc(p.name)}</td><td>${t("catégoriel")}</td>
        <td>${esc(cats)}${desc}</td></tr>`;
    }
  }).join('');

  // Objectifs
  const objRows = (cfg.outputs || []).map(o =>
    `<tr><td>${esc(o.name)}</td><td>${o.direction === 'minimize' ? t("minimiser") : t("maximiser")}</td>
      <td>${(cfg.outputs.length > 1) ? t("poids") + ' ' + (o.weight != null ? o.weight : 1) : '—'}</td></tr>`
  ).join('');

  // Contraintes hard
  const hard = cfg.constraints || [];
  const hardHtml = hard.length
    ? '<ul class="cfg-list">' + hard.map(c => `<li>${esc(c)}</li>`).join('') + '</ul>'
    : '<span class="faint">' + t("Aucune") + '</span>';

  // Contraintes soft
  const soft = cfg.soft_constraints || [];
  const softHtml = soft.length
    ? '<ul class="cfg-list">' + soft.map(c =>
        `<li>${esc(c.output)} ${c.direction === 'minimize' ? '≤' : '≥'} ${fmtNum(c.threshold)}</li>`
      ).join('') + '</ul>'
    : '<span class="faint">' + t("Aucune") + '</span>';

  // noise_prior
  const npMap = { low: t("Haute (±1-2%)"), medium: t("Moyenne (±3-7%)"), high: t("Faible (±10%+)") };
  const np = npMap[cfg.noise_prior || 'low'] || cfg.noise_prior;

  return `
    <details class="config-panel">
      <summary>${t("Configuration de la campagne")}</summary>
      <div class="config-body">
        <div class="cfg-section">
          <div class="cfg-h">${t("Paramètres")}</div>
          <table class="cfg-table"><tbody>${paramRows}</tbody></table>
        </div>
        <div class="cfg-section">
          <div class="cfg-h">${t("Objectifs")}</div>
          <table class="cfg-table"><tbody>${objRows}</tbody></table>
        </div>
        <div class="cfg-section">
          <div class="cfg-h">${t("Contraintes sur paramètres")}</div>
          ${hardHtml}
        </div>
        <div class="cfg-section">
          <div class="cfg-h">${t("Contraintes sur résultats")}</div>
          ${softHtml}
        </div>
        <div class="cfg-section">
          <div class="cfg-h">${t("Fiabilité des mesures")}</div>
          <span>${esc(np)}</span>
        </div>
      </div>
    </details>`;
}

function renderCampaign() {
  const d = campaignData;
  const cfg = d.cfg;
  const ap = d.autopilot_state;
  const isAuto = cfg.bo_settings.autopilot !== false;

  // ── Metriques ──
  const phaseVal = ap?.phase || (isAuto ? '—' : t("manuel"));
  const progVal = ap?.progress != null ? Math.round(ap.progress * 100) + '%' : '—';

  // ── Tableau ──
  const paramNames = cfg.parameters.map(p => p.name);
  const outNames = cfg.outputs.map(o => o.name);

  let thead2 = paramNames.map(p => `<th>${esc(p)}</th>`).join('')
            + outNames.map(o => `<th>${esc(o)}</th>`).join('')
            + '<th>' + t("statut") + '</th><th>iter</th><th></th>';

  let tbody = d.rows.map((r, i) => {
    const isSuggested = r.statut === 'suggere';
    const rowClass = isSuggested ? 'row-suggested' : 'row-done';
    let cells = paramNames.map(p => {
      const v = r[p];
      const num = typeof v === 'number' ? fmtNum(v, 3) : esc(v);
      return `<td class="cell-ro">${num}</td>`;
    }).join('');
    cells += outNames.map(o => {
      const v = r[o] ?? '';
      return `<td><input type="number" step="any" value="${v === null ? '' : v}"
                data-row="${i}" data-col="${esc(o)}" class="result-input"></td>`;
    }).join('');
    const badge = r.statut === 'fait'
      ? '<span class="statut-badge statut-fait">' + t("fait") + '</span>'
      : (r.statut === 'suggere' ? '<span class="statut-badge statut-suggere">' + t("suggéré") + '</span>' : '');
    cells += `<td>${badge}</td>`;
    cells += `<td class="cell-ro">${r.iteration_BO ?? ''}</td>`;
    cells += `<td><button class="row-del" title="${t("Supprimer cette ligne")}" onclick="deleteRow(${i})">✕</button></td>`;
    return `<tr class="${rowClass}">${cells}</tr>`;
  }).join('');

  if (d.rows.length === 0) {
    tbody = `<tr><td colspan="${paramNames.length + outNames.length + 3}" class="dim" style="text-align:center; padding:24px">
      ${t("Aucune expérience. Clique sur \"Suggérer\" pour générer le plan initial.")}</td></tr>`;
  }

  // ── Badges + console de la derniere suggestion ──
  let suggestFeedback = '';
  if (lastSuggestBadges.length > 0 || lastSuggestLog) {
    const badgesHtml = lastSuggestBadges.map(b =>
      `<span class="badge badge-${b.type}">${esc(b.label)}</span>`).join('');
    suggestFeedback = `
      <div class="badges">${badgesHtml}</div>
      ${lastSuggestLog ? `
      <details class="console">
        <summary>${t("Console moteur (log brut)")}</summary>
        <div class="console-body">${esc(lastSuggestLog)}</div>
      </details>` : ''}`;
  }

  // ── Mode manuel : controles supplementaires ──
  const manualControls = `
    <div class="field" id="ctl-acq" style="${isAuto ? 'display:none' : ''}">
      <label>Acquisition</label>
      <select id="sel-acq">${d.acquisitions.map(a => `<option>${a}</option>`).join('')}</select>
    </div>
    <div class="field" id="ctl-xi" style="${isAuto ? 'display:none' : ''}">
      <label>xi (exploration) <span class="range-val" id="xi-val">0.01</span></label>
      <input type="range" id="rng-xi" min="0" max="0.2" step="0.005" value="0.01"
             oninput="document.getElementById('xi-val').textContent = this.value">
    </div>
    <div class="field" id="ctl-kappa" style="${isAuto ? 'display:none' : ''}">
      <label>kappa (UCB) <span class="range-val" id="kappa-val">2.0</span></label>
      <input type="range" id="rng-kappa" min="0.1" max="5" step="0.1" value="2.0"
             oninput="document.getElementById('kappa-val').textContent = this.value">
    </div>`;

  document.getElementById('main').innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between">
      <div>
        <h1>${esc(currentCampaign)} <span class="rename-link" onclick="renameCampaign()" title="${t("Renommer")}">✎</span></h1>
        <p class="subtitle">${tn(cfg.parameters.length, '{n} paramètre', '{n} paramètres')} · ${t("objectif :")} ${esc(d.out_col)} (${d.direction})</p>
      </div>
      <button class="btn-ghost" onclick="goHome()">← ${t("Campagnes")}</button>
    </div>

    <div class="metrics">
      <div class="metric-card"><div class="label">${t("Expériences")}</div>
        <div class="value">${d.n_done}</div></div>
      ${(d.objectives || [{name:d.out_col, best:d.best, direction:d.direction}]).map(o => `
        <div class="metric-card"><div class="label">Best ${esc(o.name)}</div>
          <div class="value green">${o.best !== null && o.best !== undefined ? fmtNum(o.best) : '—'}</div>
          <span class="faint">${o.direction === 'minimize' ? '↓ min' : '↑ max'}</span></div>
      `).join('')}
      ${!d.is_multi ? `
        <div class="metric-card"><div class="label">Phase</div>
          <div class="value accent">${esc(phaseVal)}</div></div>
        <div class="metric-card"><div class="label">Progress</div>
          <div class="value">${progVal}</div></div>
      ` : `
        <div class="metric-card"><div class="label">Mode</div>
          <div class="value accent" style="font-size:17px">${t("Multi-objectif")}</div>
          <span class="faint">EHVI / Pareto</span></div>
      `}
    </div>

    ${buildConfigPanel(cfg)}

    <div class="card">
      <h2 style="margin-top:0">${t("Plan d'expériences")}</h2>
      <p class="faint" style="margin-bottom:12px">${t("Remplis les résultats puis sauvegarde. Les conditions sont en lecture seule.")}</p>
      <div class="table-wrap">
        <table>
          <thead><tr>${thead2}</tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
      <div style="display:flex; gap:12px; margin-top:14px">
        <button class="btn-green" onclick="saveResults()">${t("Sauvegarder les résultats")}</button>
        <button class="btn-ghost" onclick="showAddRowModal()">${t("+ Ajouter une ligne (prior)")}</button>
        <button class="btn-ghost" onclick="exportCsv()">${t("Exporter CSV")}</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">${t("Suggérer les prochaines expériences")}</h2>
      <div class="controls">
        ${d.is_multi ? `
          <div class="field"><label>${t("Stratégie")}</label>
            <div class="value" style="font-size:14px; color:var(--accent-h); padding-top:6px">EHVI / qNEHVI</div></div>
        ` : `
        <div class="toggle-wrap">
          <div class="toggle ${isAuto ? 'on' : ''}" id="toggle-auto" onclick="toggleAuto()">
            <div class="knob"></div>
          </div>
          <span class="toggle-label">${isAuto ? 'Autopilot' : t("Manuel")}</span>
        </div>`}
        <div class="field">
          <label>n suggestions</label>
          <input type="number" id="n-suggest" min="1" max="10" value="${cfg.bo_settings.n_suggestions || 1}" style="min-width:80px">
        </div>
        ${d.is_multi ? '' : manualControls}
        <button class="btn-primary" id="btn-suggest" onclick="runSuggest()">${t("Suggérer")}</button>
      </div>
      <div id="suggest-feedback">${suggestFeedback}</div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">${t("Graphes")}</h2>
      <div class="graph-toggles">
        <label class="check-wrap"><input type="checkbox" id="chk-conv" checked onchange="refreshGraphs()"> Convergence</label>
        ${!d.is_multi ? `<label class="check-wrap"><input type="checkbox" id="chk-acq" onchange="refreshGraphs()"> ${t("Acquisition 1D")}</label>` : ''}
        ${d.is_multi ? `<label class="check-wrap"><input type="checkbox" id="chk-pareto" checked onchange="refreshGraphs()"> ${t("Front de Pareto")}</label>` : ''}
      </div>
      <div id="acq-controls" class="hidden" style="margin-bottom:12px">
        <div class="field" style="max-width:240px">
          <label>${t("Paramètre à visualiser")}</label>
          <select id="acq-param" onchange="drawAcq1d()"></select>
        </div>
      </div>
      <div id="plot-conv" class="plot-box"></div>
      <div id="plot-acq" class="plot-box"></div>
      <div id="plot-pareto" class="plot-box"></div>
    </div>

    <div id="modal-zone"></div>
  `;

  refreshGraphs();
}

/* ── Toggle autopilot/manuel ── */
async function toggleAuto() {
  const t = document.getElementById('toggle-auto');
  const isNowAuto = !t.classList.contains('on');
  t.classList.toggle('on');
  t.parentElement.querySelector('.toggle-label').textContent = isNowAuto ? 'Autopilot' : t("Manuel");
  for (const id of ['ctl-acq', 'ctl-xi', 'ctl-kappa']) {
    document.getElementById(id).style.display = isNowAuto ? 'none' : '';
  }
  // Persistance immediate dans le YAML
  await API.set_mode(currentCampaign, isNowAuto);
}

/* ── Sauvegarde des resultats edites ── */
async function saveResults() {
  const rows = JSON.parse(JSON.stringify(campaignData.rows));
  document.querySelectorAll('.result-input').forEach(inp => {
    const i = parseInt(inp.dataset.row);
    const col = inp.dataset.col;
    rows[i][col] = inp.value === '' ? null : parseFloat(inp.value);
  });
  const res = await API.save_results(currentCampaign, JSON.stringify(rows));
  if (res.ok) { toast(t("Résultats sauvegardés")); openCampaign(currentCampaign); }
  else toast(res.error, 'error');
}

/* ── Ajout ligne manuelle (prior) ── */
function showAddRowModal() {
  const cfg = campaignData.cfg;
  const fields = cfg.parameters.map(p => {
    if (p.type === 'continuous') {
      const mid = ((p.min + p.max) / 2).toFixed(2);
      return `<div class="field"><label>${esc(p.name)}</label>
        <input type="number" step="any" id="add-${esc(p.name)}" value="${mid}"></div>`;
    }
    return `<div class="field"><label>${esc(p.name)}</label>
      <select id="add-${esc(p.name)}">${p.categories.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>`;
  }).join('');
  const outFields = cfg.outputs.map(o =>
    `<div class="field"><label>${esc(o.name)}</label>
      <input type="number" step="any" id="add-${esc(o.name)}" value="0"></div>`).join('');

  document.getElementById('modal-zone').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${t("Ajouter une expérience (prior)")}</h2>
        <p class="faint" style="margin-bottom:14px">${t("Pour saisir une expérience déjà réalisée (conditions + résultat).")}</p>
        <div style="display:flex; gap:14px; flex-wrap:wrap">${fields}${outFields}</div>
        <div class="actions">
          <button class="btn-ghost" onclick="closeModal()">${t("Annuler")}</button>
          <button class="btn-primary" onclick="submitAddRow()">${t("Ajouter")}</button>
        </div>
      </div>
    </div>`;
}

async function submitAddRow() {
  const cfg = campaignData.cfg;
  const row = {};
  for (const p of cfg.parameters) {
    const el = document.getElementById('add-' + p.name);
    row[p.name] = p.type === 'continuous' ? parseFloat(el.value) : el.value;
  }
  for (const o of cfg.outputs) {
    row[o.name] = parseFloat(document.getElementById('add-' + o.name).value);
  }
  const res = await API.add_manual_row(currentCampaign, JSON.stringify(row));
  if (res.ok) { toast(t("Ligne ajoutée")); closeModal(); openCampaign(currentCampaign); }
  else toast(res.error, 'error');
}

/* ── Suggestion ── */
async function runSuggest(force = false) {
  const btn = document.getElementById('btn-suggest');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + t("Calcul...");

  // POINT 7 : sauvegarder d'abord les yields edites a l'ecran (disque = verite)
  const rows = JSON.parse(JSON.stringify(campaignData.rows));
  let hasEdits = false;
  document.querySelectorAll('.result-input').forEach(inp => {
    const i = parseInt(inp.dataset.row);
    const col = inp.dataset.col;
    const newVal = inp.value === '' ? null : parseFloat(inp.value);
    if (rows[i][col] !== newVal) hasEdits = true;
    rows[i][col] = newVal;
  });
  if (hasEdits) {
    await API.save_results(currentCampaign, JSON.stringify(rows));
  }

  const toggleEl = document.getElementById('toggle-auto');
  const isAuto = toggleEl ? toggleEl.classList.contains('on') : false;
  const selAcq = document.getElementById('sel-acq');
  const rngXi = document.getElementById('rng-xi');
  const rngKappa = document.getElementById('rng-kappa');
  const opts = {
    n_suggest: parseInt(document.getElementById('n-suggest').value),
    mode_auto: isAuto,
    acquisition: (isAuto || !selAcq) ? 'EI' : selAcq.value,
    xi: (isAuto || !rngXi) ? 0.01 : parseFloat(rngXi.value),
    kappa: (isAuto || !rngKappa) ? 2.0 : parseFloat(rngKappa.value),
    force: force,
  };

  const res = await API.suggest(currentCampaign, JSON.stringify(opts));

  // OPTION B : suggestions en attente -> proposer de remplacer
  if (!res.ok && res.pending) {
    btn.disabled = false;
    btn.textContent = t("Suggérer");
    showPendingDialog(res.pending);
    return;
  }

  if (res.ok) {
    lastSuggestLog = res.log;
    lastSuggestBadges = res.badges || [];
    if (res.is_init) {
      toast(t("Plan initial : {k} expérience(s) LHS générée(s). Remplis les résultats puis relance.", {k: res.n_added}));
    } else {
      toast(t("{k} suggestion(s) ajoutée(s)", {k: res.n_added}) + (res.iteration ? ' (' + t("itération {k}", {k: res.iteration}) + ')' : ''));
    }
    const data = await API.get_campaign(currentCampaign);
    campaignData = data;
    renderCampaign();
  } else {
    lastSuggestLog = res.log || res.error;
    toast(res.error, 'error');
    btn.disabled = false;
    btn.textContent = t("Suggérer");
    document.getElementById('suggest-feedback').innerHTML = `
      <details class="console" open>
        <summary>${t("Erreur (log)")}</summary>
        <div class="console-body">${esc(lastSuggestLog)}</div>
      </details>`;
  }
}

function showPendingDialog(n) {
  document.getElementById('modal-zone').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:460px">
        <h2>${t("Suggestions en attente")}</h2>
        <p class="dim" style="margin-bottom:8px; line-height:1.6">
          ${t("Il y a déjà {b} sans résultat saisi. Que veux-tu faire ?", {b: '<b style="color:var(--text)">' + t("{k} expérience(s) suggérée(s)", {k: n}) + '</b>'})}
        </p>
        <p class="faint" style="margin-bottom:18px">
          ${t("Remplir d'abord ces expériences évite un plan incohérent. Tu peux aussi les remplacer si tu as changé d'avis.")}
        </p>
        <div class="actions">
          <button class="btn-ghost" onclick="closeModal()">${t("Garder et remplir")}</button>
          <button class="btn-primary" onclick="closeModal(); runSuggest(true)">${t("Remplacer")}</button>
        </div>
      </div>
    </div>`;
}

/* ════════════════════════════════════════════════════════════
   GRAPHES
   ════════════════════════════════════════════════════════════ */
async function refreshGraphs() {
  const showConv = document.getElementById('chk-conv')?.checked;
  const showAcq = document.getElementById('chk-acq')?.checked;
  const showPareto = document.getElementById('chk-pareto')?.checked;

  document.getElementById('plot-conv').innerHTML = '';
  document.getElementById('plot-acq').innerHTML = '';
  const paretoBox = document.getElementById('plot-pareto');
  if (paretoBox) paretoBox.innerHTML = '';
  const acqCtrl = document.getElementById('acq-controls');
  if (acqCtrl) acqCtrl.classList.toggle('hidden', !showAcq);

  if (showConv) drawConvergence();
  if (showAcq) {
    const params = await API.get_cont_params(currentCampaign);
    const sel = document.getElementById('acq-param');
    if (sel && sel.options.length === 0) {
      sel.innerHTML = params.map(p => `<option>${esc(p)}</option>`).join('');
    }
    drawAcq1d();
  }
  if (showPareto) drawPareto();
}

async function drawPareto() {
  const box = document.getElementById('plot-pareto');
  if (!box) return;
  const res = await API.get_pareto(currentCampaign);
  if (!res.ok) { box.innerHTML = `<p class="faint">${esc(res.error||'')}</p>`; return; }
  if (res.empty) { box.innerHTML = '<p class="faint" style="padding:14px 0">' + t("Pas encore de données pour le front de Pareto.") + '</p>'; return; }

  // séparer points Pareto / dominés
  const px=[], py=[], dx=[], dy=[];
  for (let i=0;i<res.x.length;i++) {
    if (res.is_pareto[i]) { px.push(res.x[i]); py.push(res.y[i]); }
    else { dx.push(res.x[i]); dy.push(res.y[i]); }
  }
  // trier les points Pareto pour tracer la ligne
  const order = px.map((_,i)=>i).sort((a,b)=>px[a]-px[b]);
  const plx = order.map(i=>px[i]), ply = order.map(i=>py[i]);

  const traces = [
    { x: dx, y: dy, mode:'markers', name:t("Dominés"),
      marker:{ color:'#6f6975', size:8 } },
    { x: plx, y: ply, mode:'markers+lines', name:t("Front de Pareto"),
      marker:{ color:'#e8483d', size:11 }, line:{ color:'#e8483d', width:1.5, dash:'dot' } },
  ];
  const layout = { ...PLOTLY_LAYOUT, height: 420,
    xaxis:{ ...PLOTLY_LAYOUT.xaxis, title:`${res.name_x} (${res.dir_x})` },
    yaxis:{ ...PLOTLY_LAYOUT.yaxis, title:`${res.name_y} (${res.dir_y})` } };
  Plotly.newPlot(box, traces, layout, PLOTLY_CONFIG);
}

async function renameCampaign() {
  const newName = prompt(t("Nouveau nom de la campagne :"), currentCampaign);
  if (!newName || newName.trim() === currentCampaign) return;
  const res = await API.rename_campaign(currentCampaign, newName.trim());
  if (res.ok) {
    toast(t("Campagne renommée"));
    currentCampaign = res.name;
    openCampaign(res.name);
  } else {
    toast(res.error, 'error');
  }
}

async function deleteRow(idx) {
  const row = campaignData.rows[idx];
  const label = row && row.statut === 'fait' ? ' (' + t("résultat saisi") + ')' : '';
  if (!confirm(t("Supprimer cette expérience{label} ?", {label}))) return;
  const res = await API.delete_row(currentCampaign, idx);
  if (res.ok) {
    toast(t("Ligne supprimée"));
    const data = await API.get_campaign(currentCampaign);
    campaignData = data;
    renderCampaign();
  } else {
    toast(res.error, 'error');
  }
}

async function exportCsv() {
  const res = await API.export_csv(currentCampaign);
  if (!res.ok) { formError(res.error); return; }
  // Déclencher un téléchargement côté navigateur
  const blob = new Blob([res.csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = res.filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast(t("CSV exporté"));
}

async function drawConvergence() {
  const res = await API.get_convergence(currentCampaign);
  const box = document.getElementById('plot-conv');
  if (!res.ok || res.empty) {
    box.innerHTML = '<p class="faint" style="padding:14px 0">' + t("Pas encore de résultats pour la convergence.") + '</p>';
    return;
  }
  const traces = [
    { x: res.x, y: res.raw, mode: 'markers', name: t("Mesures"),
      marker: { color: '#6f6975', size: 7 } },
    { x: res.x, y: res.best, mode: 'lines+markers', name: 'Best so far',
      line: { color: '#e8483d', width: 2.5 } },
  ];
  const layout = { ...PLOTLY_LAYOUT, height: 360,
    xaxis: { ...PLOTLY_LAYOUT.xaxis, title: t("Expérience") },
    yaxis: { ...PLOTLY_LAYOUT.yaxis, title: res.out_col } };
  Plotly.newPlot(box, traces, layout, PLOTLY_CONFIG);
}

async function drawAcq1d() {
  const box = document.getElementById('plot-acq');
  const param = document.getElementById('acq-param').value;
  if (!param) { box.innerHTML = '<p class="faint">' + t("Aucun paramètre continu.") + '</p>'; return; }

  box.innerHTML = '<p class="faint" style="padding:14px 0"><span class="spinner" style="border-top-color:#e8483d"></span>' + t("Calcul GP...") + '</p>';

  const isAuto = document.getElementById('toggle-auto')?.classList.contains('on');
  const opts = {
    param: param,
    acquisition: isAuto ? 'EI' : (document.getElementById('sel-acq')?.value || 'EI'),
    xi: isAuto ? 0.01 : parseFloat(document.getElementById('rng-xi')?.value || 0.01),
    kappa: isAuto ? 2.0 : parseFloat(document.getElementById('rng-kappa')?.value || 2.0),
  };

  const res = await API.get_acq_1d(currentCampaign, JSON.stringify(opts));
  if (!res.ok) { box.innerHTML = `<p class="faint">${esc(res.error)}</p>`; return; }
  if (res.empty) { box.innerHTML = `<p class="faint">${esc(res.msg)}</p>`; return; }

  const mu = res.mu, sigma = res.sigma, grid = res.grid;
  const upper = mu.map((m, i) => m + sigma[i]);
  const lower = mu.map((m, i) => m - sigma[i]);

  const traces = [
    // bande incertitude
    { x: [...grid, ...grid.slice().reverse()],
      y: [...upper, ...lower.slice().reverse()],
      fill: 'toself', fillcolor: 'rgba(232,72,61,0.12)',
      line: { color: 'rgba(0,0,0,0)' }, name: '±σ', showlegend: false,
      yaxis: 'y2', hoverinfo: 'skip' },
    { x: grid, y: mu, mode: 'lines', name: 'μ GP',
      line: { color: '#e8483d', width: 2 }, yaxis: 'y2' },
    { x: res.obs_x, y: res.obs_y, mode: 'markers', name: 'Observations',
      marker: { color: '#fbbf24', size: 9 }, yaxis: 'y2' },
    { x: grid, y: res.acq, mode: 'lines', name: res.acquisition,
      line: { color: '#4ade80', width: 2 }, fill: 'tozeroy',
      fillcolor: 'rgba(74,222,128,0.09)' },
  ];

  const layout = {
    ...PLOTLY_LAYOUT, height: 480,
    xaxis: { ...PLOTLY_LAYOUT.xaxis, title: res.param },
    yaxis: { ...PLOTLY_LAYOUT.yaxis, title: res.acquisition, domain: [0, 0.38] },
    yaxis2: { gridcolor: '#262c3a', zerolinecolor: '#262c3a',
              title: res.out_col, domain: [0.46, 1] },
    shapes: [{
      type: 'line', x0: res.argmax_x, x1: res.argmax_x, y0: 0, y1: 1,
      yref: 'paper', line: { color: '#ef4444', dash: 'dash', width: 1.5 },
    }],
    annotations: [{
      x: res.argmax_x, y: 1.02, yref: 'paper', text: t("prochain"),
      showarrow: false, font: { color: '#ef4444', size: 11 },
    }],
  };
  Plotly.newPlot(box, traces, layout, PLOTLY_CONFIG);
}
